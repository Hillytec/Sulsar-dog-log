.st-card{width:100%;max-width:480px;max-height:94dvh;overflow-y:auto;background:var(--secondary);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));color:var(--neutral);font-family:'Inter',-apple-system,sans-serif;}

.st-t{font-weight:800;font-size:16px;margin-bottom:2px;}
.st-d{font-size:14px;line-height:1.4;color:var(--neutral);}

.tm-big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--tertiary);margin:6px 0 2px;letter-spacing:.02em;}
.tm-sub{text-align:center;font-size:12px;color:var(--neutral-dim);margin-bottom:14px;}
.al-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35;}
.al-row:last-child{border-bottom:none;}

.iv-ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1200;background:rgba(5,8,16,.96);display:flex;flex-direction:column;font-family:'Inter',-apple-system,sans-serif;}
.iv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#c9cfdd;font-size:12px;}

.ar-row:last-of-type{border-bottom:none;}
.ar-btn{width:44px;height:40px;margin-left:6px;border:1.5px solid var(--neutral-dim);background:transparent;color:var(--neutral);border-radius:10px;font-size:15px;cursor:pointer;}
.ar-btn:disabled{opacity:.25;cursor:default;}
.ar-btn:active{background:var(--secondary-lighter);}

<script>
(function(){

var SUPABASE_URL = 'https://rxjylnyeokgcgyulcery.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4anlsbnllb2tnY2d5dWxjZXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDkwNjcsImV4cCI6MjEwNDEyNTA2N30.rJXecBwmVYu9PcSQs1SaYt9Ik4x57KF7tA-IwKgMaZo';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var state = { person:null, loginCode:'', loginError:'', loginBusy:false,
  screen:'home', draft:null, index:[], recognizingField:null, recognition:null,
  profiles:[], settings:{id:'app',activeProfileId:null,pin:null}, editingProfileId:null,
  filter:{text:'', dateFrom:'', dateTo:''}, filterOpen:false, locked:false, pinEntry:'', pinError:'',
  assessors:[], myAssessors:[], assessorPickBusy:false, _uploadProgress:{} };

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var DB_NAME='k9fieldlog', DB_VERSION=5, STORE='logs', PROFILE_STORE='profile', SETTINGS_STORE='settings', AUTH_STORE='auth', QUEUE_STORE='uploadQueue', _dbp=null;
function openDB(){
  if(_dbp) return _dbp;
  _dbp = new Promise(function(resolve,reject){
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(PROFILE_STORE)) db.createObjectStore(PROFILE_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(SETTINGS_STORE)) db.createObjectStore(SETTINGS_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(AUTH_STORE)) db.createObjectStore(AUTH_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(QUEUE_STORE)) db.createObjectStore(QUEUE_STORE,{keyPath:'id'});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbp;
}
function dbGetAll(store){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var req = db.transaction(store,'readonly').objectStore(store).getAll();
      req.onsuccess=function(){ resolve(req.result||[]); };
      req.onerror=function(){ reject(req.error); };
    });
  });
}
function dbGet(store, id){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var req = db.transaction(store,'readonly').objectStore(store).get(id);
      req.onsuccess=function(){ resolve(req.result||null); };
      req.onerror=function(){ reject(req.error); };
    });
  });
}
function dbPut(store, record){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,'readwrite');
      tx.objectStore(store).put(record);
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  });
}
function dbDelete(store, id){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  });
}

async function loadAppData(){
  var profiles = await dbGetAll(PROFILE_STORE);
  var legacy = profiles.find(function(p){ return p.id==='dog'; });
  if(legacy){
    var migrated = {id: uid('prof'), dogName: legacy.dogName||'', handlerName: legacy.handlerName||'', photo: legacy.photo||null};
    await dbPut(PROFILE_STORE, migrated);
    await dbDelete(PROFILE_STORE, 'dog');
    profiles = profiles.filter(function(p){ return p.id!=='dog'; }).concat([migrated]);
  }
  state.profiles = profiles;
  var settings = await dbGet(SETTINGS_STORE, 'app');
  if(!settings) settings = {id:'app', activeProfileId: profiles[0]?profiles[0].id:null, pin:null};
  if(!settings.activeProfileId && profiles.length) settings.activeProfileId = profiles[0].id;
  if(legacy) await dbPut(SETTINGS_STORE, settings);
  state.settings = settings;
  state.locked = !!settings.pin;
}
function activeProfile(){
  return state.profiles.find(function(p){ return p.id===state.settings.activeProfileId; }) || null;
}
async function saveProfile(p){
  if(!p.id) p.id = uid('prof');
  await dbPut(PROFILE_STORE, p);
  var i = state.profiles.findIndex(function(x){ return x.id===p.id; });
  if(i>=0) state.profiles[i]=p; else state.profiles.push(p);
  if(!state.settings.activeProfileId) await setActiveProfile(p.id);
}
async function deleteProfile(id){
  await dbDelete(PROFILE_STORE, id);
  state.profiles = state.profiles.filter(function(p){ return p.id!==id; });
  if(state.settings.activeProfileId===id){
    state.settings.activeProfileId = state.profiles[0]?state.profiles[0].id:null;

async function saveLog(log){
  /* local-first: always persist on-device before touching the network, so a dropped
     signal in the field never loses the report */
  log._syncStatus = 'pending';
  await dbPut(STORE, log);
  try{
    var res = await sb.from('reports').upsert(logToRow(log));
    if(res.error) throw res.error;
    log._syncStatus = 'synced';
    await dbPut(STORE, log);
    await loadIndex();
  }catch(e){
    /* leave it queued locally; syncQueue() retries this and any pending media on the
       next connectivity check instead of losing the save */
    console.error('Report save queued for retry (offline or request failed):', e);
  }
}

/* ---------- media upload queue (photos) ---------- */
var MEDIA_BUCKET = 'report-media';
function backoffMs(attempts){
  var steps=[5000,30000,120000,600000]; // 5s, 30s, 2min, 10min
  return steps[Math.min(Math.max(attempts,1)-1, steps.length-1)];
}
async function enqueueMedia(reportId, kind, targetId, blob, path){
  var item = {id: uid('q'), reportId:reportId, kind:kind, targetId:targetId, blob:blob, path:path,
    status:'queued', attempts:0, nextAttempt:0, createdAt: Date.now()};
  await dbPut(QUEUE_STORE, item);
  return item;
}
async function uploadQueuedItem(item){
  item.status='uploading'; await dbPut(QUEUE_STORE, item);
  try{
    await storageUploadXHR(item.path, item.blob, function(pct){
      state._uploadProgress[item.targetId] = pct;
      throttledRender();
    });
  }catch(err){
    item.attempts=(item.attempts||0)+1;
    item.status='failed';
    item.lastError = err.message||String(err);
    item.nextAttempt = Date.now()+backoffMs(item.attempts);
    delete state._uploadProgress[item.targetId];
    await dbPut(QUEUE_STORE, item);
    throw err;
  }
  delete state._uploadProgress[item.targetId];
  var pub = sb.storage.from(MEDIA_BUCKET).getPublicUrl(item.path);
  item.status='done';
  await dbPut(QUEUE_STORE, item);
  return pub.data.publicUrl;
}
/* raw XHR upload (rather than the Supabase SDK's fetch-based one) purely so we get
   real upload progress events for the on-screen percentage */
function storageUploadXHR(path, blob, onProgress){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    var url = SUPABASE_URL+'/storage/v1/object/'+MEDIA_BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/');
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Authorization', 'Bearer '+SUPABASE_ANON_KEY);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert', 'true');
    xhr.setRequestHeader('Content-Type', blob.type||'application/octet-stream');
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded/e.total)*100));
    };
    xhr.onload = function(){
      if(xhr.status>=200 && xhr.status<300){ if(onProgress) onProgress(100); resolve(); }
      else reject(new Error('Upload failed (status '+xhr.status+')'));
    };
    xhr.onerror = function(){ reject(new Error('Network error during upload')); };
    xhr.send(blob);
  });
}
var _lastProgressRender = 0;
function throttledRender(){
  var now = Date.now();
  if(now-_lastProgressRender>250){ _lastProgressRender=now; render(); }
}
async function attachMediaUrl(reportId, kind, targetId, url){
  var arrKey = 'photos';
  var rec = await dbGet(STORE, reportId);
  if(rec){
    var m = (rec[arrKey]||[]).find(function(x){return x.id===targetId;});
    if(m){ m.url=url; m.uploadStatus='done'; }
    await dbPut(STORE, rec);
  }
  if(state.draft && state.draft.id===reportId){
    var m2 = (state.draft[arrKey]||[]).find(function(x){return x.id===targetId;});
    if(m2){ m2.url=url; m2.uploadStatus='done'; }
  }
  var toSync = (state.draft && state.draft.id===reportId) ? state.draft : rec;
  if(toSync){ try{ await saveLog(toSync); }catch(e){} }
}
var _syncing=false;
async function syncQueue(){
  if(_syncing || typeof navigator!=='undefined' && navigator.onLine===false) return;
  _syncing=true;
  var changed=false; /* only redraw the screen if something actually changed, and never while someone is typing */
  try{
    /* retry any reports that saved locally but never reached the server */
    var pendingLogs = (await dbGetAll(STORE)).filter(function(l){ return l._syncStatus==='pending'; });
    for(var j=0;j<pendingLogs.length;j++){ await saveLog(pendingLogs[j]); changed=true; }

    var items = await dbGetAll(QUEUE_STORE);
    var now = Date.now();
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(it.kind==='video'){ await dbDelete(QUEUE_STORE, it.id); continue; } /* video upload was removed from the app: drop any leftover queued clip instead of uploading it */
      if(it.status==='done') continue;
      if(it.status==='failed' && it.attempts>=6) continue; /* needs manual retry, stop hammering */
      if(it.status==='failed' && it.nextAttempt>now) continue;
      try{
        var url = await uploadQueuedItem(it);
        await attachMediaUrl(it.reportId, it.kind, it.targetId, url);
        changed=true;
      }catch(e){ /* stays queued/failed, picked up on the next pass */ }
    }
  } finally {
    _syncing=false;
    var a = document.activeElement;
    var typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    var formScreen = state.screen==='profiles' || state.screen==='settings' || state.screen==='assessors';
    if(changed && !typing && !formScreen) render();
  }
}
if(typeof window!=='undefined'){
  window.addEventListener('online', syncQueue);
  setInterval(syncQueue, 20000);
}

function exportLog(log){

  var filename = 'k9log-'+(log.dog||'dog')+'-'+log.date+'-'+log.id.slice(-6)+'.json';
  if(navigator.canShare && navigator.canShare({files:[new File([blob],filename,{type:'application/json'})]})){
    var file = new File([blob], filename, {type:'application/json'});
    navigator.share({files:[file], title:filename}).catch(function(){ downloadBlob(blob, filename); });
  } else {
    downloadBlob(blob, filename);
  }
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function importLogFile(file){
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var data = JSON.parse(reader.result);
      if(data && data.type==='k9fieldlog-backup' && Array.isArray(data.logs)){
        for(var i=0;i<data.logs.length;i++){ await saveLog(data.logs[i]); }
        if(Array.isArray(data.profiles)){
          for(var j=0;j<data.profiles.length;j++){ await dbPut(PROFILE_STORE, data.profiles[j]); }
        }
        await loadAppData();
        alert('Imported '+data.logs.length+' log(s) from backup.');
        state.screen='home'; render();
        return;
      }
      var log = data;
      if(!log.id || !log.date){ alert('That file does not look like a Search Dog Log export.'); return; }
      await saveLog(log);
      state.draft = log;
      state.screen = (state.person.role!=='assessor' && log.status==='draft') ? 'edit' : 'view';
      render();
    }catch(e){ alert('Could not read that file. Make sure it is a log or backup exported from this app.'); }
  };
  reader.readAsText(file);
}

async function downloadLogPDF(log){
  if(!window.jspdf){ alert('The PDF tool has not finished loading. Check your connection and try again in a moment.'); return; }
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4'});
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var margin = 42, y = margin, lineH = 14;

  function ensureSpace(h){ if(y+h > pageH-margin){ doc.addPage(); y = margin; } }
  var pendingTitle = null;
  function sectionTitle(text){ pendingTitle = text; } /* drawn together with the first content under it, so a heading is never left alone at the foot of a page */
  function flushTitle(h){
    h = Math.min(h, pageH-margin*2-16);
    if(pendingTitle===null){ ensureSpace(h); return; }
    ensureSpace(16+h);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(230,110,20);
    doc.text(String(pendingTitle).toUpperCase(), margin, y); y+=14;
    pendingTitle = null;
  }
  function field(label, value){
    if(value===undefined||value===null||value==='') return;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    var lines = doc.splitTextToSize(String(value), pageW-margin*2);
    flushTitle(11+lines.length*lineH+6); /* label and its text always stay together */
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text(String(label).toUpperCase(), margin, y); y+=11;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(lines, margin, y); y += lines.length*lineH+8;
  }
  function fieldRow(pairs){
    var colW = (pageW-margin*2-20)/2;
    var linesArr = pairs.map(function(p){
      var v = (p[1]===undefined||p[1]===null||p[1]==='') ? '\u2014' : String(p[1]);
      return doc.splitTextToSize(v, colW);
    });
    var maxLines = Math.max(linesArr[0].length, linesArr[1].length);
    flushTitle(maxLines*lineH+18);
    pairs.forEach(function(p,i){
      var x = margin + i*(colW+20);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
      doc.text(String(p[0]).toUpperCase(), x, y);
    });
    y += 11;
    pairs.forEach(function(p,i){
      var x = margin + i*(colW+20);
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
      doc.text(linesArr[i], x, y);
    });
    y += maxLines*lineH+8;
  }

  doc.setFillColor(27,38,59); doc.rect(0,0,pageW,64,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text('Search Dog Log', margin, 34);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(224,225,221);
  doc.text('NSARDA Suffolk', margin, 50);
  doc.setFontSize(10);
  doc.text(String(log.status).toUpperCase(), pageW-margin, 34, {align:'right'});
  y = 90;

  fieldRow([['Date', log.date],['Time of day', log.timeOfDay]]);
  fieldRow([['Handler', log.handler],['Dog', log.dog]]);
  fieldRow([['Session type', log.type],['Location', log.location]]);
  field('Training objective', log.trainingObjective);

  sectionTitle('Weather');
  if(log.weather.indoors){
    field('Conditions', 'Indoors');
  } else {
    fieldRow([['Temperature', log.weather.temperature!==''?log.weather.temperature+' C':''],['Humidity', log.weather.humidityPct?log.weather.humidityPct+'%':log.weather.humidityLevel]]);
    fieldRow([['Wind speed', log.weather.windSpeed!==''?log.weather.windSpeed+' mph':''],['Wind direction', log.weather.windDirDeg!=null?(compassPoint(log.weather.windDirDeg)+' ('+log.weather.windDirDeg+' deg)'):'']]);
    field('Conditions', log.weather.conditions);
  }
  field('Environment / conditions notes', log.environmentConditions);

  if(log.sketches && log.sketches.length){
    sectionTitle('Sketch map'+(log.sketches.length>1?'s':''));
    var skN = log.sketches.length, skGap = 12, skAvail = pageW-margin*2;
    var skW = Math.min(170, (skAvail-skGap*(skN-1))/skN), skH = 0;

    flushTitle(skH+30);
    log.sketches.forEach(function(sk,i){
      var ar=(sk.w&&sk.h)?sk.w/sk.h:0.56, hh=skW/ar, x=margin+i*(skW+skGap);

      doc.text('Sketch '+(i+1)+(sk.createdAt?' - '+new Date(sk.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''), x, y+hh+12);
    });

  if(log.alerts && log.alerts.length){

      field(fmtClock(a.at)+((log.timing&&log.timing.start)?' (+'+fmtElapsed(a.at-log.timing.start)+')':''), a.note||'Alert');

  sectionTitle('Trail & hides');

  var dbFive = STRATEGY_POINTS.filter(function(p,i){ return log.debriefFive && log.debriefFive[i]; }).map(function(p){return p.t;});
  if(log.debriefWell || log.debriefChange || dbFive.length){

/* ---------- weather / sun ---------- */
function wmoText(code){
  var m = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',
    51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
    71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',
    95:'Thunderstorm'};
  return m[code] || 'Overcast';
}
function compassPoint(deg){
  var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg%360)/22.5))%16];
}
async function fetchWeather(){
  if(!navigator.geolocation){ alert('Location services are not available on this device. Enter weather manually below.'); return; }
  navigator.geolocation.getCurrentPosition(async function(pos){
    var lat=pos.coords.latitude, lon=pos.coords.longitude;
    state.draft.weather.lat=lat; state.draft.weather.lon=lon;
    try{
      var res = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
        '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=mph&timezone=auto');
      var data = await res.json();
      var c = data.current;
      state.draft.weather.temperature = Math.round(c.temperature_2m);
      state.draft.weather.humidityPct = Math.round(c.relative_humidity_2m);
      state.draft.weather.humidityLevel = c.relative_humidity_2m>70?'high':(c.relative_humidity_2m>40?'med':'low');
      state.draft.weather.windSpeed = Math.round(c.wind_speed_10m);
      state.draft.weather.windDirDeg = Math.round(c.wind_direction_10m);
      state.draft.weather.conditions = wmoText(c.weather_code);
      state.draft.weather.fetchedAt = new Date().toISOString();
    }catch(e){ alert('Could not reach the weather service. Check your connection or enter values manually.'); }
    if(window.SunCalc){
      var sp = SunCalc.getPosition(new Date(), lat, lon);
      state.draft.weather.sunAzimuthDeg = Math.round(((sp.azimuth*180/Math.PI)+180)%360);
    }
    render();
  }, function(){ alert('Location permission was denied. You can still enter weather manually below.'); });
}
function drawCompass(){
  var w = state.draft.weather;
  var cx=60, cy=60, r=48;
  function pt(deg){ var rad=(deg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
  var lines='';
  if(w.windDirDeg!=null){ var p=pt(w.windDirDeg); lines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#5DA9E0" stroke-width="3" stroke-linecap="round"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#5DA9E0"/>'; }
  if(w.sunAzimuthDeg!=null){ var p2=pt(w.sunAzimuthDeg); lines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p2[0]+'" y2="'+p2[1]+'" style="stroke:var(--sun)" stroke-width="3" stroke-linecap="round"/><circle cx="'+p2[0]+'" cy="'+p2[1]+'" r="4" style="fill:var(--sun)"/>'; }
  if(state.draft.gpx && state.draft.gpx.bearing!=null){ var p3=pt(state.draft.gpx.bearing); lines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p3[0]+'" y2="'+p3[1]+'" stroke="#FF6B00" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>'; }
  return '<svg width="120" height="120" viewBox="0 0 120 120">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" style="stroke:var(--neutral);stroke-opacity:.3" stroke-width="1.5"/>'+
    '<text x="60" y="10" fill="#8D93A6" font-size="10" text-anchor="middle">N</text>'+
    '<text x="60" y="116" fill="#8D93A6" font-size="10" text-anchor="middle">S</text>'+
    '<text x="6" y="63" fill="#8D93A6" font-size="10" text-anchor="middle">W</text>'+
    '<text x="114" y="63" fill="#8D93A6" font-size="10" text-anchor="middle">E</text>'+
    lines+'<circle cx="'+cx+'" cy="'+cy+'" r="2.5" style="fill:var(--neutral)"/></svg>';
}

/* ---------- GPX ---------- */
function parseGPX(text){
  var doc = new DOMParser().parseFromString(text,'application/xml');
  var nodes = Array.from(doc.getElementsByTagName('trkpt'));
  if(nodes.length===0) nodes = Array.from(doc.getElementsByTagName('wpt'));
  var pts = nodes.map(function(n){ return [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon'))]; })
    .filter(function(p){ return !isNaN(p[0]) && !isNaN(p[1]); });
  if(pts.length>350){ var step=Math.ceil(pts.length/350); pts = pts.filter(function(_,i){return i%step===0;}); }
  return pts;
}
function bearingBetween(a,b){
  var lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  var y=Math.sin(dLon)*Math.cos(lat2);
  var x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
var mapInstance = null;
function renderMap(elId, gpx){
  var el = document.getElementById(elId);
  if(!el) return;
  if(mapInstance){ mapInstance.remove(); mapInstance=null; }
  if(!gpx || !gpx.points || !gpx.points.length) return;
  var map = L.map(el,{zoomControl:false, attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  var line = L.polyline(gpx.points,{color:'#FF6B00',weight:4}).addTo(map);
  map.fitBounds(line.getBounds(),{padding:[18,18]});
  L.circleMarker(gpx.points[0],{radius:6,color:'#FFD60A',fillColor:'#FFD60A',fillOpacity:1}).addTo(map);
  L.circleMarker(gpx.points[gpx.points.length-1],{radius:6,color:'#1B263B',fillColor:'#E0E1DD',fillOpacity:1,weight:2}).addTo(map);
  mapInstance = map;
}

/* ---------- photos ---------- */
/* Two outputs per photo: a small dataURL kept inline for instant offline preview
   (cheap, always works even with no signal), and a separate compressed blob that
   goes to Supabase Storage via the upload queue instead of being embedded in the
   report row — this is what was making saves large and fragile on weak signal. */
function loadImage(file){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function drawScaled(img, maxW){
  var scale = Math.min(1, maxW/img.width);
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas;
}
function compressImage(file, maxW){
  /* small inline preview — kept for backward compatibility with existing callers */
  return loadImage(file).then(function(img){ return drawScaled(img, maxW||480).toDataURL('image/jpeg',0.55); });
}
function compressImageForUpload(file){
  return loadImage(file).then(function(img){
    var canvas = drawScaled(img, 1280);
    return new Promise(function(resolve){ canvas.toBlob(function(blob){ resolve(blob); }, 'image/jpeg', 0.72); });
  });
}

/* ---------- speech recognition ---------- */
function getRecognition(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  var rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB';
  return rec;
}
function toggleMic(fieldId){
  if(state.recognizingField === fieldId){
    if(state.recognition) state.recognition.stop();
    return;
  }
  if(state.recognition){ state.recognition.onend=null; state.recognition.stop(); }
  var rec = getRecognition();
  if(!rec){ alert('Voice input is not supported in this browser. Try Chrome on Android, or type instead.'); return; }
  var ta = document.getElementById(fieldId);
  var base = ta ? ta.value : '';
  if(base && !/\s$/.test(base)) base += ' ';
  var finalText = '';
  state.recognition = rec;
  state.recognizingField = fieldId;
  refreshMicButtons();
  rec.onresult = function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += t + ' '; else interim += t;
    }
    var el = document.getElementById(fieldId);
    if(el){ el.value = base + finalText + interim; onDraftInput(fieldId, el.value); }
  };
  rec.onerror = function(){ state.recognizingField=null; refreshMicButtons(); };
  rec.onend = function(){ if(state.recognizingField===fieldId){ state.recognizingField=null; refreshMicButtons(); } };
  try{ rec.start(); }catch(e){}
}
function refreshMicButtons(){
  document.querySelectorAll('.mic-btn').forEach(function(b){
    var f = b.getAttribute('data-field');
    b.classList.toggle('rec', state.recognizingField===f);
  });
}
function onDraftInput(field, value){
  var parts = field.split('.');
  var o = state.draft;
  for(var i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
}
window.onDraftInput = onDraftInput;
window.toggleMic = toggleMic;

  if(!pending.length) body += '<div class="empty" style="padding:20px;">Nothing waiting for review.</div>';

}

/* ---------- arrange the menus (order is remembered on this phone) ---------- */
var APP_VERSION = 'v21 - 20 Oct 2026';
var MENU_DEFAULT = ['session','weather','sketch','bounds','ready','ground','timer','trail','scent','photos','gpx','notes','mapping'];
var MENU_NAMES = {session:'Session', weather:'Weather & direction', sketch:'Sketch map', bounds:'Search area & boundaries', ready:'Pre-search checklist',
  ground:'Search checklist', timer:'Search timer & alerts', trail:'Trail & hides', scent:'Scent article', photos:'Photos', gpx:'GPX map / mapping', notes:'Notes & summary', mapping:'Mapping page'};
function menuOrder(){
  var saved = (state.settings && state.settings.menuOrder) || [];
  var out = saved.filter(function(k){ return MENU_DEFAULT.indexOf(k)>=0; });
  MENU_DEFAULT.forEach(function(k){ if(out.indexOf(k)<0) out.push(k); }); /* any menu added in future shows up at the end */
  return out;
}
function orderedSections(secs){ return menuOrder().map(function(k){ return secs[k]||''; }).join(''); }
function arrangePanel(){

function setupSignaturePad(){
  var canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.strokeStyle='#3B82F6'; ctx.lineWidth=2.4; ctx.lineCap='round';
  var drawing=false, last=null;
  function pos(e){
    var rect=canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height)};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
}

function skDrawStroke(ctx, st, k){
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(st.t==='pen' || st.t==='erase'){
    ctx.strokeStyle = st.t==='erase' ? '#ffffff' : st.c;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = st.w*k;
    var p = st.pts;
    if(p.length===1){ ctx.beginPath(); ctx.arc(p[0].x*k,p[0].y*k,st.w*k/2,0,Math.PI*2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0].x*k,p[0].y*k);
    for(var i=1;i<p.length-1;i++){
      var mx=(p[i].x+p[i+1].x)/2, my=(p[i].y+p[i+1].y)/2;
      ctx.quadraticCurveTo(p[i].x*k,p[i].y*k,mx*k,my*k);
    }
    ctx.lineTo(p[p.length-1].x*k,p[p.length-1].y*k);
    ctx.stroke();
  } else if(st.t==='arrow'){
    var ax=st.a.x*k, ay=st.a.y*k, bx=st.b.x*k, by=st.b.y*k;
    var ang=Math.atan2(by-ay,bx-ax), hl=16*k;
    ctx.strokeStyle=st.c; ctx.fillStyle=st.c; ctx.lineWidth=4*k;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.lineTo(bx-hl*Math.cos(ang-0.45),by-hl*Math.sin(ang-0.45));
    ctx.lineTo(bx-hl*Math.cos(ang+0.45),by-hl*Math.sin(ang+0.45));
    ctx.closePath(); ctx.fill();
    ctx.font='800 '+(14*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    var lx = ax - Math.cos(ang)*14*k, ly = ay - Math.sin(ang)*14*k;
    ctx.fillText(st.label, lx, ly);
  } else if(st.t==='stamp'){
    skDrawIcon(ctx, st.kind, st.x*k, st.y*k, k);
  } else if(st.t==='line'){
    skDrawLine(ctx, st, k);
  } else if(st.t==='text'){
    ctx.font='700 '+(16*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.lineWidth=4*k; ctx.strokeStyle='#ffffff'; ctx.strokeText(st.text, st.x*k, st.y*k);
    ctx.fillStyle=st.c; ctx.fillText(st.text, st.x*k, st.y*k);
  }
}
var SK_LABELS = {start:'Start', alert:'Alert', find:'Find', body:'Body', tree:'Tree', shrub:'Shrub', path:'Path', ditch:'Ditch', hedge:'Hedge'};
function skDrawIcon(ctx, kind, x, y, k){
  var r = 13*k;
  function disc(col, lbl){
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 '+(14*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lbl, x, y+k*0.5);
  }
  if(kind==='start'){ disc('#2E9E4F','S'); }
  else if(kind==='alert'){ disc('#D62828','A'); }
  else if(kind==='find'){
    ctx.fillStyle='#C2185B'; ctx.beginPath();
    ctx.moveTo(x,y-r*1.25); ctx.lineTo(x+r*1.25,y); ctx.lineTo(x,y+r*1.25); ctx.lineTo(x-r*1.25,y); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 '+(14*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('F', x, y+k*0.5);
  } else if(kind==='body'){
    ctx.fillStyle='#222222'; ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*k; ctx.strokeRect(x-r+2*k,y-r+2*k,r*2-4*k,r*2-4*k);
    ctx.fillStyle='#fff'; ctx.font='800 '+(14*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('B', x, y+k*0.5);
  } else if(kind==='tree'){
    ctx.fillStyle='#7A4B1E'; ctx.fillRect(x-2.5*k, y+3*k, 5*k, 11*k);
    ctx.fillStyle='#1B6B35'; ctx.beginPath(); ctx.arc(x, y-3*k, 11*k, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#2E9E4F'; ctx.beginPath(); ctx.arc(x-3*k, y-6*k, 4*k, 0, Math.PI*2); ctx.fill();
  } else if(kind==='shrub'){
    ctx.fillStyle='#4CAF50';
    [[-6,2,6],[6,2,6],[0,-4,7]].forEach(function(c){ ctx.beginPath(); ctx.arc(x+c[0]*k, y+c[1]*k, c[2]*k, 0, Math.PI*2); ctx.fill(); });
    ctx.strokeStyle='#1B6B35'; ctx.lineWidth=1.5*k;
    [[-6,2,6],[6,2,6],[0,-4,7]].forEach(function(c){ ctx.beginPath(); ctx.arc(x+c[0]*k, y+c[1]*k, c[2]*k, 0, Math.PI*2); ctx.stroke(); });
  }
}
function skResample(pts, step){
  var out=[pts[0]], acc=0;
  for(var i=1;i<pts.length;i++){
    var dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y, d=Math.sqrt(dx*dx+dy*dy);
    if(!d) continue;
    var pos = step-acc;
    while(pos<=d){ out.push({x:pts[i-1].x+dx*pos/d, y:pts[i-1].y+dy*pos/d}); pos+=step; }
    acc = d-(pos-step);
  }
  return out;
}
function skDrawLine(ctx, st, k){
  var P = st.pts.map(function(p){ return {x:p.x*k, y:p.y*k}; });
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(P.length<2) return;
  if(st.kind==='path'){
    ctx.strokeStyle='#8B5A2B'; ctx.lineWidth=4*k; ctx.setLineDash([10*k,7*k]);
    ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for(var i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); ctx.stroke();
    ctx.setLineDash([]);
  } else if(st.kind==='ditch'){
    var R = skResample(P, 7*k); if(R.length<2) return;
    ctx.strokeStyle='#1E6FD9'; ctx.lineWidth=2.5*k;
    ctx.beginPath();
    for(var j=0;j<R.length;j++){
      var a=R[Math.max(0,j-1)], b=R[Math.min(R.length-1,j+1)];
      var ang=Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2, o=(j%2?1:-1)*5*k;
      var px=R[j].x+Math.cos(ang)*o, py=R[j].y+Math.sin(ang)*o;
      if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  } else if(st.kind==='hedge'){
    var H = skResample(P, 7*k);
    ctx.fillStyle='#1B6B35'; ctx.strokeStyle='#0F4A22'; ctx.lineWidth=1*k;
    H.forEach(function(p){ ctx.beginPath(); ctx.arc(p.x,p.y,6*k,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  }
}
function skRedraw(preview){
  if(!sk) return;
  var ctx = sk.ctx, c = sk.canvas;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  var k = sk.dpr;
  sk.strokes.forEach(function(st){ skDrawStroke(ctx, st, k); });
  if(preview) skDrawStroke(ctx, preview, k);
}

  if(h) h.textContent = hints[sk.tool]||'';
}

      '<button type="button" class="sk-btn" data-tool="path">Path</button>'+

    '<div class="sk-stage"><canvas id="skCanvas"></canvas></div>'+
    '<div class="sk-bar sk-bot"><button type="button" class="sk-btn" data-act="undo">Undo</button><button type="button" class="sk-btn" data-act="clear">Clear</button><div class="sk-hint"></div></div>';
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  var canvas = document.getElementById('skCanvas');
  var stage = ov.querySelector('.sk-stage');
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  var cw = Math.max(200, stage.clientWidth), ch = Math.max(200, stage.clientHeight);
  canvas.width = Math.round(cw*dpr); canvas.height = Math.round(ch*dpr);
  sk = { canvas:canvas, ctx:canvas.getContext('2d'), cw:cw, ch:ch, dpr:dpr, strokes:[], tool:'pen', colour:SK_COLOURS[0], width:3, cur:null };
  skRedraw(); skUpdateUI();

  function pt(e){ var r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(sk.cw/r.width), y:(e.clientY-r.top)*(sk.ch/r.height)}; }
  canvas.addEventListener('pointerdown', function(e){
    if(!sk) return;
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(x){}
    var p = pt(e), t = sk.tool;
    if(t==='pen' || t==='erase'){
      sk.cur = {t:t, c:sk.colour, w: t==='erase' ? sk.width*5 : sk.width, pts:[p]};
      skRedraw(sk.cur);
    } else if(t==='north' || t==='wind'){
      sk.cur = {t:'arrow', c: t==='north' ? '#111111' : '#1E6FD9', label: t==='north' ? 'N' : 'WIND', a:p, b:p};
    } else if(t==='path' || t==='ditch' || t==='hedge'){
      sk.cur = {t:'line', kind:t, pts:[p]};
      skRedraw(sk.cur);
    } else if(t==='text'){
      var txt = prompt('Type your label (e.g. Hedge gap, Car park)', '');
      if(txt && txt.trim()){ sk.strokes.push({t:'text', c:sk.colour, text:txt.trim().slice(0,40), x:p.x, y:p.y}); }
      skRedraw();
    } else if(SK_LABELS[t] && (t==='start'||t==='alert'||t==='find'||t==='body'||t==='tree'||t==='shrub')){
      sk.strokes.push({t:'stamp', kind:t, x:p.x, y:p.y});
      skRedraw();
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if(!sk || !sk.cur) return;
    e.preventDefault();
    var p = pt(e);
    if(sk.cur.t==='arrow') sk.cur.b = p; else sk.cur.pts.push(p);
    skRedraw(sk.cur);
  });
  function up(e){
    if(!sk || !sk.cur) return;
    var cur = sk.cur; sk.cur = null;
    if(cur.t==='arrow'){
      var dx=cur.b.x-cur.a.x, dy=cur.b.y-cur.a.y;
      if(Math.sqrt(dx*dx+dy*dy) < 25){ skRedraw(); return; }
    }
    if(cur.t==='line' && cur.pts.length<3){ skRedraw(); return; }
    sk.strokes.push(cur); skRedraw();
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  ov.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b || !sk) return;
    if(b.hasAttribute('data-c')){ sk.tool='pen'; sk.colour=b.getAttribute('data-c'); skUpdateUI(); }
    else if(b.hasAttribute('data-tool')){ sk.tool=b.getAttribute('data-tool'); skUpdateUI(); }
    else if(b.hasAttribute('data-w')){ sk.width=+b.getAttribute('data-w'); skUpdateUI(); }
    else if(b.getAttribute('data-act')==='undo'){ sk.strokes.pop(); skRedraw(); }
    else if(b.getAttribute('data-act')==='clear'){ if(!sk.strokes.length || confirm('Clear the whole sketch?')){ sk.strokes=[]; skRedraw(); } }
    else if(b.getAttribute('data-act')==='cancel'){
      if(sk.strokes.length && !confirm('Discard this sketch?')) return;
      closeSketch();
    }
    else if(b.getAttribute('data-act')==='save'){ saveSketch(); }
  });
}
function exportSketchPNG(){
  var k = 1000/Math.max(sk.cw, sk.ch);
  var used = [];
  sk.strokes.forEach(function(st){
    var kind = st.t==='stamp' ? st.kind : (st.t==='line' ? st.kind : null);
    if(kind && used.indexOf(kind)<0) used.push(kind);
  });
  var W = Math.round(sk.cw*k), kk = k*0.7, rowH = Math.round(28*k), padX = 14*k;
  var meas = document.createElement('canvas').getContext('2d');
  meas.font='700 '+(12*k)+'px Inter, Arial, sans-serif';
  var items = used.map(function(kind){
    var isLine = (kind==='path'||kind==='ditch'||kind==='hedge');
    var iw = isLine ? 38*kk : 36*kk;
    return {kind:kind, isLine:isLine, iw:iw, w: iw + 4*k + meas.measureText(SK_LABELS[kind]).width + 14*k};
  });
  var rows = [[]], rx = padX;
  items.forEach(function(it){
    if(rx + it.w > W - padX && rows[rows.length-1].length){ rows.push([]); rx = padX; }
    rows[rows.length-1].push(it); rx += it.w;
  });
  var legH = used.length ? rows.length*rowH + Math.round(6*k) : 0;
  var out = document.createElement('canvas');
  out.width = W; out.height = Math.round(sk.ch*k) + legH;
  var ctx = out.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,out.width,out.height);
  sk.strokes.forEach(function(st){ skDrawStroke(ctx, st, k); });
  if(legH){
    var ly = Math.round(sk.ch*k);
    ctx.fillStyle='#f3f3f3'; ctx.fillRect(0,ly,out.width,legH);
    ctx.strokeStyle='#cccccc'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,ly+0.5); ctx.lineTo(out.width,ly+0.5); ctx.stroke();
    ctx.font='700 '+(12*k)+'px Inter, Arial, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    rows.forEach(function(row, ri){
      var x = padX, cy = ly + Math.round(3*k) + ri*rowH + rowH/2;
      row.forEach(function(it){
        if(it.isLine){
          var seg = {t:'line', kind:it.kind, pts:[{x:0,y:0},{x:10,y:0},{x:20,y:0},{x:30,y:0}]};
          ctx.save(); ctx.translate(x, cy); skDrawLine(ctx, seg, kk); ctx.restore();
        } else { skDrawIcon(ctx, it.kind, x+it.iw/2, cy, kk); }
        ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#222222'; ctx.fillText(SK_LABELS[it.kind], x+it.iw+4*k, cy);
        x += it.w;
      });
    });
  }
  return {dataUrl: out.toDataURL('image/png'), w: out.width, h: out.height};
}
async function saveSketch(){
  if(!sk) return;
  if(!sk.strokes.length){ alert('Draw something first, then tap Save.'); return; }

  var d = state.draft;

  closeSketch();
  state._open = state._open||{}; state._open.sketch = true;
  render();
  try{ await dbPut(STORE, d); }catch(e){}
  showStrategy(true);
}

function fmtElapsed(ms){
  var t = Math.max(0, Math.floor(ms/1000)), h = Math.floor(t/3600), m = Math.floor((t%3600)/60), sec = t%60;
  function z(n){ return (n<10?'0':'')+n; }
  return (h? h+':'+z(m) : z(m)) + ':' + z(sec);
}

  goHome: async function(){ state.screen='home'; render(); await loadIndex(); render(); },
  goTrainerQueue: async function(){ state.screen='trainer'; render(); await loadAssessorQueue(); render(); },
  newLogTap: function(){ state._arranging=false; state.draft = newLog(); state.screen='edit'; render(); },
  openLog: async function(id){
    var log = await loadLog(id);
    if(!log) return;
    state._arranging=false;
    state.draft = log;
    state.screen = (state.person.role!=='assessor' && log.status==='draft') ? 'edit' : 'view';
    render();
  },
  editCurrentDraft: function(){ state.screen='edit'; render(); },
  setField: function(path, val){ onDraftInput(path, val); render(); },
  setWeatherField: function(key,val){ state.draft.weather[key]=val; render(); },
  fetchWeather: function(){ fetchWeather(); },
  onPhotos: async function(e){
    var remaining = 6 - (state.draft.photos||[]).length;
    var files = Array.from(e.target.files||[]).slice(0, Math.max(0,remaining));
    if(!files.length){ render(); return; }
    for(var i=0;i<files.length;i++){
      var file = files[i];
      var id = uid('p');
      var preview = await compressImage(file, 480);
      state.draft.photos.push({id:id, dataUrl:preview, uploadStatus:'queued'});
      render(); /* show it immediately, before the upload even starts */
      compressImageForUpload(file).then(function(photoId){
        return function(blob){
          var path = state.person.id+'/'+state.draft.id+'/'+photoId+'.jpg';
          return enqueueMedia(state.draft.id, 'photo', photoId, blob, path);
        };
      }(id)).then(function(){ syncQueue(); });
    }
    /* persist the draft locally straight away — nothing here depends on a network call */
    await dbPut(STORE, state.draft);
  },
  removePhoto: function(id){ state.draft.photos = state.draft.photos.filter(function(p){return p.id!==id;}); render(); },
  setTheme: function(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('sdl_theme', t); }catch(e){}
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t==='light' ? '#EEF1F6' : '#1B263B');
    render();
  },
  toggleTheme: function(){
    var next = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('sdl_theme', next); }catch(e){}
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', next==='light' ? '#EEF1F6' : '#1B263B');
    var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(next==='light'?'moon':'sun', 22);
  },
  refreshApp: async function(){
    try{
      if('serviceWorker' in navigator){ var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function(r){ return r.unregister(); })); }
      if(window.caches){ var keys = await caches.keys(); await Promise.all(keys.map(function(k){ return caches.delete(k); })); }
    }catch(e){}
    location.reload();
  },
  arrangeMenus: function(){ state._arranging = true; render(); window.scrollTo(0,0); },
  doneArranging: function(){ state._arranging = false; render(); },
  moveMenu: async function(key, dir){
    var o = menuOrder(), i = o.indexOf(key), j = i+dir;
    if(i<0 || j<0 || j>=o.length) return;
    var t = o[i]; o[i] = o[j]; o[j] = t;
    state.settings.menuOrder = o;
    try{ await saveSettings(); }catch(e){}
    render();
  },
  resetMenuOrder: async function(){ state.settings.menuOrder = null; try{ await saveSettings(); }catch(e){} render(); },
  secToggle: function(key, isOpen){ state._open = state._open||{}; state._open[key] = !!isOpen; },
  toggleReady: function(key, el){
    state.draft.readiness = state.draft.readiness||{};
    if(el.checked) state.draft.readiness[key] = true; else delete state.draft.readiness[key];
    var row = el.closest('.rd-row'); if(row) row.classList.toggle('on', el.checked);
    var c = document.getElementById('rdCount'); if(c) c.textContent = readinessCount(state.draft)+'/'+readinessKeys().length;
  },
  openSketch: function(){ openSketch(); },
  toggleGround: function(key, el){
    state.draft.onground = state.draft.onground||{};
    if(el.checked) state.draft.onground[key] = true; else delete state.draft.onground[key];
    var row = el.closest('.rd-row'); if(row) row.classList.toggle('on', el.checked);
    var c = document.getElementById('gdCount'); if(c) c.textContent = groundCount(state.draft)+'/'+GROUND_ITEMS.length;
  },
  startSearch: async function(){ state.draft.timing = {start:Date.now(), end:null}; state._open=state._open||{}; state._open.timer=true; render(); try{ await dbPut(STORE, state.draft); }catch(e){} },
  stopSearch: async function(){
    var t = state.draft.timing; if(!t || !t.start || t.end) return;
    t.end = Date.now();
    if(!state.draft.timeOnTrail) state.draft.timeOnTrail = fmtElapsed(t.end - t.start);
    render(); try{ await dbPut(STORE, state.draft); }catch(e){}
  },
  resetSearch: function(){ if(!confirm('Reset the timer? Start and finish times will be cleared.')) return; state.draft.timing = null; render(); },
  setAlertNote: function(v){ state._alertNote = v; },
  logAlert: async function(){
    state.draft.alerts = state.draft.alerts||[];
    state.draft.alerts.push({id:uid('al'), at:Date.now(), note:(state._alertNote||'').trim()});
    state._alertNote=''; state._open=state._open||{}; state._open.timer=true; render();
    try{ await dbPut(STORE, state.draft); }catch(e){}
  },
  removeAlert: function(id){ state.draft.alerts = (state.draft.alerts||[]).filter(function(a){return a.id!==id;}); render(); },
  toggleFive: function(i, el){
    state.draft.debriefFive = state.draft.debriefFive||{};
    if(el.checked) state.draft.debriefFive[i]=true; else delete state.draft.debriefFive[i];
    var row = el.closest('.rd-row'); if(row) row.classList.toggle('on', el.checked);
  },
  removeSketch: function(id){
    if(!confirm('Delete this sketch?')) return;
    state.draft.sketches = (state.draft.sketches||[]).filter(function(x){return x.id!==id;});
    render();
  },
  showStrategy: function(){ showStrategy(false); },
  setCommentBody: function(v){ state._commentBody = v; },
  postComment: async function(){
    var body = (state._commentBody||'').trim();
    if(!body) return;
    state.draft.comments = state.draft.comments||[];
    state.draft.comments.push({
      id: uid('c'), authorRole: state.person.role, authorName: state.person.name,
      body: body, createdAt: Date.now()
    });
    state._commentBody='';
    render();
    try{ await saveLog(state.draft); }catch(e){}
  },
  requestChanges: async function(){
    var notesEl = document.getElementById('trainerSignoffNotes');
    var notes = notesEl ? notesEl.value.trim() : '';
    if(notes){
      state.draft.comments = state.draft.comments||[];
      state.draft.comments.push({id: uid('c'), authorRole:'assessor', authorName: state.person.name,
        body: notes, createdAt: Date.now()});
    }
    state.draft.status = 'changes_requested';
    try{ await saveLog(state.draft); state.screen = 'trainer'; }catch(e){}
    render();
  },
  retryFailedUploads: function(){ syncQueue(); },
  onGpx: function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var pts = parseGPX(reader.result);
      var bearing = pts.length>1 ? bearingBetween(pts[0], pts[Math.min(5,pts.length-1)]) : null;
      state.draft.gpx = { points:pts, name:file.name, bearing: bearing!=null?Math.round(bearing):null };
      render();
    };
    reader.readAsText(file);
  },
  saveDraft: async function(){
    state.draft.status='draft';
    try{ await saveLog(state.draft); state.screen='home'; }catch(e){}
    render();
  },
  submitForReview: async function(){
    state.draft.status='submitted';
    try{ await saveLog(state.draft); state.screen='home'; }catch(e){}
    render();
  },
  deleteCurrentLog: async function(){
    if(!confirm('Delete this log? This cannot be undone.')) return;
    await removeLog(state.draft.id);
    state.screen='home'; render();
  },
  clearSignature: function(){ var c=document.getElementById('sigCanvas'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); },

  goSettings: function(){ state.screen='settings'; render(); },
  goProfiles: function(){ state.editingProfileId=null; state.screen='profiles'; render(); },
  goAssessors: async function(){
    state.screen='assessors'; render();
    await loadMyAssessors();
    render();
  },
  addAssessorTap: async function(){
    var sel = document.getElementById('addAssessorSelect');
    if(!sel || !sel.value) return;
    await addMyAssessor(sel.value);
    render();
  },
  removeAssessor: async function(id){
    if(!confirm('Remove this assessor? They will no longer be able to see your reports.')) return;
    await removeMyAssessor(id);
    render();
  },
  newProfile: function(){ state.editingProfileId='new'; state._newProfileDraft={dogName:'',handlerName:'',photo:null,insurer:'',insuranceRenewal:'',immunisationDate:'',immunisationPhoto:null}; render(); },
  editExistingProfile: function(id){
    var p = state.profiles.find(function(x){return x.id===id;});
    state._newProfileDraft = p ? JSON.parse(JSON.stringify(p)) : null; /* working copy: Cancel discards it */
    state.editingProfileId=id; render();
  },
  setProfField: function(k,v){ if(state._newProfileDraft) state._newProfileDraft[k]=v; },
  viewProfileImms: function(){ var d=state._newProfileDraft; if(d && d.immunisationPhoto) openImageViewer(d.immunisationPhoto); },
  cancelEditProfile: function(){ state.editingProfileId=null; state._newProfileDraft=null; render(); },
  onProfilePhoto: function(e){
    var file = e.target.files[0];
    if(!file) return;
    compressImage(file, 400).then(function(url){
      if(state._newProfileDraft) state._newProfileDraft.photo = url;
      render();
    });
  },
  onImmunisationPhoto: function(e){
    var file = e.target.files[0];
    if(!file) return;
    loadImage(file).then(function(img){ return drawScaled(img, 1400).toDataURL('image/jpeg',0.72); }).then(function(url){
      if(state._newProfileDraft) state._newProfileDraft.immunisationPhoto = url;
      render();
    });
  },
  saveProfileForm: async function(){
    var p = state._newProfileDraft || {};
    function val(id, k){ var el=document.getElementById(id); if(el) p[k]=el.value; }
    val('profDogName','dogName'); val('profHandlerName','handlerName'); val('profInsurer','insurer');
    val('profInsuranceRenewal','insuranceRenewal'); val('profImmsDate','immunisationDate');
    p.dogName = (p.dogName||'').trim(); p.handlerName = (p.handlerName||'').trim(); p.insurer = (p.insurer||'').trim();
    await saveProfile(p);
    state.editingProfileId = null; state._newProfileDraft = null;
    render();
  },
  setActive: async function(id){ await setActiveProfile(id); render(); },
  removeProfile: async function(id){
    if(!confirm('Remove this dog profile? Existing logs are not affected.')) return;
    await deleteProfile(id);
    render();
  },

  setFilterText: function(v){ state.filter.text=v; render(); },
  setFilterDate: function(k,v){ state.filter[k]=v; render(); },
  toggleFilterOpen: function(){ state.filterOpen=!state.filterOpen; render(); },
  clearFilter: function(){ state.filter={text:'',dateFrom:'',dateTo:''}; render(); },

  setPin: async function(){
    var a = document.getElementById('newPin').value.trim();
    var b = document.getElementById('confirmPin').value.trim();
    if(!/^\d{4,6}$/.test(a)){ alert('PIN must be 4-6 digits.'); return; }
    if(a!==b){ alert('PINs do not match.'); return; }
    state.settings.pin = a;
    await saveSettings();
    render();
  },
  removePin: async function(){
    if(!confirm('Remove the app PIN?')) return;
    state.settings.pin = null;
    await saveSettings();
    render();
  },
  unlock: function(){
    var el = document.getElementById('pinInput');
    var val = el ? el.value.trim() : '';
    if(val===state.settings.pin){ state.locked=false; state.pinError=''; render(); }
    else{ state.pinError='Incorrect PIN'; render(); }
  },

  exportAll: async function(){
    var logs = await allLogsFull();
    var backup = { type:'k9fieldlog-backup', version:1, exportedAt:new Date().toISOString(), profiles:state.profiles, logs:logs };
    var blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
    downloadBlob(blob, 'search-dog-log-backup-'+new Date().toISOString().slice(0,10)+'.json');
  },

  duplicateLogTap: function(){
    if(!state.draft) return;
    state.draft = duplicateLog(state.draft);
    state.screen='edit'; render();
  },

  shareLog: function(){ if(state.draft) exportLog(state.draft); },
  downloadPDF: function(){ if(state.draft) downloadLogPDF(state.draft); },
  quickDelete: async function(id){
    if(!confirm('Delete this log? This cannot be undone.')) return;
    var res = await sb.from('reports').delete().eq('id',id);
    if(res.error){ alert('Could not delete: '+res.error.message); return; }
    if(state.screen==='trainer') await loadAssessorQueue(); else await loadIndex();
    render();
  },
  onImport: function(e){
    var file = e.target.files[0];
    if(file) importLogFile(file);
    e.target.value='';
  },
  signOff: async function(){
    var canvas = document.getElementById('sigCanvas');
    var nameEl = document.getElementById('trainerName');
    var name = nameEl ? nameEl.value.trim() : '';
    if(!name){ alert('Enter the trainer name to confirm sign-off.'); return; }
    var notesEl = document.getElementById('trainerSignoffNotes');
    var toEl = document.getElementById('toReview');
    state.draft.trainerSignoff = {
      name: name,
      signatureDataUrl: canvas.toDataURL('image/png'),
      date: new Date().toISOString(),
      trainingOfficerReview: toEl ? toEl.checked : false,
      notes: notesEl ? notesEl.value : ''
    };
    state.draft.status = 'signed';
    try{
      await saveLog(state.draft);
      state.screen = state.person.role==='assessor' ? 'trainer' : 'home';
      if(state.screen==='trainer') await loadAssessorQueue();
    }catch(e){}
    render();
  }
};

/* ---------- boot ---------- */
async function bootAfterLogin(){
  await loadAppData();
  if(state.person.role==='assessor'){ await loadAssessorQueue(); }
  else { await loadIndex(); await loadAllAssessors(); }
  render();
}

(async function boot(){
  document.getElementById('app').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--neutral-dim);">Loading...</div>';
  await loadSession();
  if(state.person){
    if(state.person.role==='assessor' && state.screen==='home') state.screen='trainer';
    render();
    await bootAfterLogin();
    syncQueue();
  } else {
    render();
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();

})();
</script>
</body>
</html>
